name: Sync Google Reviews

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Nie zwei Syncs gleichzeitig – verhindert abgelehnte Pushes durch parallele Läufe
concurrency:
  group: sync-reviews
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run sync script
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/sync-reviews.js

      - name: Commit reviews.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/reviews.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen an reviews.json."
            exit 0
          fi
          git commit -m "chore: update google reviews [skip ci]"

          # Push mit Wiederholung: holt bei Bedarf neue Commits und überträgt erneut
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then
              echo "Push erfolgreich (Versuch $attempt)."
              exit 0
            fi
            echo "::warning::Push fehlgeschlagen (Versuch $attempt) – neuer Versuch."
            sleep $((attempt * 10))
            git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
          done
          echo "::error::Push nach 5 Versuchen fehlgeschlagen."
          exit 1
